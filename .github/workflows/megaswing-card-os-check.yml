name: MegaSwing Card OS Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "routes/dashboard/**"
      - "megaswing-preview/**"
      - ".github/workflows/megaswing-card-os-check.yml"
  push:
    branches:
      - megaswing-object-card-os
    paths:
      - "routes/dashboard/**"
      - "megaswing-preview/**"
      - ".github/workflows/megaswing-card-os-check.yml"

jobs:
  card-os-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Strict-check MegaSwing resolver model
        shell: bash
        run: |
          node_modules/.bin/tsc \
            --noEmit \
            --strict \
            --skipLibCheck \
            --target esnext \
            --module preserve \
            --moduleResolution bundler \
            routes/dashboard/megaswing-data.ts \
            routes/dashboard/megaswing-resolver.ts

      - name: Smoke-compile Gutenberg Object Card route
        shell: bash
        run: |
          node_modules/.bin/esbuild routes/dashboard/stage.tsx \
            --bundle \
            --platform=browser \
            --format=esm \
            --jsx=automatic \
            '--external:@wordpress/*' \
            --external:react \
            '--external:react/*' \
            --outfile=/tmp/megaswing-dashboard.js
          test -s /tmp/megaswing-dashboard.js

      - name: Verify Vercel preview payload
        shell: bash
        run: |
          test -s megaswing-preview/index.html
          grep -q "MegaSwing 360" megaswing-preview/index.html
          grep -q "Gutenberg" megaswing-preview/index.html
