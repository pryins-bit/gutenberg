name: MegaSwing Card OS Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "routes/dashboard/**"
      - ".github/workflows/megaswing-card-os-check.yml"
  push:
    branches:
      - megaswing-object-card-os
    paths:
      - "routes/dashboard/**"
      - ".github/workflows/megaswing-card-os-check.yml"

jobs:
  dashboard-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck MegaSwing dashboard route
        shell: bash
        run: |
          if [ -x node_modules/.bin/tsc ]; then
            node_modules/.bin/tsc -p routes/dashboard/tsconfig.json --pretty false
          elif [ -x node_modules/.bin/tsgo ]; then
            node_modules/.bin/tsgo -p routes/dashboard/tsconfig.json --pretty false
          else
            echo "No TypeScript CLI found in workspace"
            exit 1
          fi
